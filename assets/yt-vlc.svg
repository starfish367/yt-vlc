<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for VLC Cone -->
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="35%" stop-color="#FF9800"/>
      <stop offset="65%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="whiteStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B0BEC5"/>
      <stop offset="35%" stop-color="#ECEFF1"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <!-- Gradients for YouTube Play Badge -->
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Shadow Base -->
  <ellipse cx="128" cy="228" rx="88" ry="16" fill="#000000" opacity="0.35" filter="blur(4px)"/>

  <!-- VLC Base Ring -->
  <ellipse cx="128" cy="216" rx="84" ry="18" fill="url(#baseGrad)" stroke="#BF360C" stroke-width="2"/>
  <ellipse cx="128" cy="214" rx="72" ry="14" fill="#E65100"/>

  <!-- VLC Cone Body -->
  <g filter="url(#dropShadow)">
    <!-- Base Section -->
    <path d="M 68 210 L 80 162 C 95 167 161 167 176 162 L 188 210 C 170 216 86 216 68 210 Z" fill="url(#coneGrad)"/>
    <!-- Bottom White Stripe -->
    <path d="M 80 162 L 91 120 C 103 124 153 124 165 120 L 176 162 C 161 167 95 167 80 162 Z" fill="url(#whiteStripe)"/>
    <!-- Middle Orange Section -->
    <path d="M 91 120 L 102 78 C 111 81 145 81 154 78 L 165 120 C 153 124 103 124 91 120 Z" fill="url(#coneGrad)"/>
    <!-- Top White Stripe -->
    <path d="M 102 78 L 112 44 C 118 46 138 46 144 44 L 154 78 C 145 81 111 81 102 78 Z" fill="url(#whiteStripe)"/>
    <!-- Cone Tip (Rounded) -->
    <path d="M 112 44 C 116 26 140 26 144 44 C 138 46 118 46 112 44 Z" fill="url(#coneGrad)"/>
  </g>

  <!-- YouTube Play Badge (Prominent Center-Right / Center Overlay) -->
  <g filter="url(#badgeShadow)">
    <!-- Red Rounded Rectangle -->
    <rect x="78" y="112" width="100" height="70" rx="20" ry="20" fill="url(#ytRed)" stroke="#B71C1C" stroke-width="2"/>
    <!-- Glossy Highlight on Badge -->
    <path d="M 80 128 C 80 118 88 114 98 114 L 158 114 C 168 114 176 118 176 128 C 150 124 105 124 80 128 Z" fill="#FFFFFF" opacity="0.3"/>
    <!-- White Triangle Play Symbol -->
    <polygon points="120,132 120,162 145,147" fill="#FFFFFF"/>
  </g>
</svg>
